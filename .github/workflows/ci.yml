name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      retrain:
        description: "Also re-run the full training pipeline"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest --cov=heartrisk --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t heartrisk .
      - name: Smoke test the API inside the image
        run: |
          docker run -d --name api -p 8000:8000 heartrisk uvicorn heartrisk.api:app --host 0.0.0.0 --port 8000
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fsS -X POST localhost:8000/predict -H 'Content-Type: application/json' \
            -d '{"age":61,"sex":1,"cp":4,"trestbps":140,"chol":260,"fbs":0,"restecg":0,"thalach":120,"exang":1,"oldpeak":2.0}'
          docker rm -f api
      - name: Show API logs on failure
        if: failure()
        run: docker logs api || true

  retrain:
    if: github.event_name == 'workflow_dispatch' && inputs.retrain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
          python -m heartrisk.train
          pytest tests/test_predict_api.py
      - uses: actions/upload-artifact@v5
        with:
          name: trained-model
          path: |
            models/
            reports/
